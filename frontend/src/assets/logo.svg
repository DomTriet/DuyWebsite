<svg xmlns="https://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,400&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap');
      .hero-text { font-family: 'Lora', Georgia, serif; font-weight: 600; fill: #0D0D0D; }
      .sub-text   { font-family: 'Space Grotesk', sans-serif; font-weight: 700; fill: #B8860B; letter-spacing: 0.25em; }
      .tagline-text { font-family: 'Space Grotesk', sans-serif; font-weight: 400; fill: #6B7280; }
      .divider { stroke: #B8860B; stroke-width: 1; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Diamond / house mark — centered top -->
  <g transform="translate(400, 90)">
    <path d="M 0 -22 L 16 0 L 0 22 L -16 0 Z" fill="none" stroke="#B8860B" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#B8860B"/>
    <path d="M -8 -11 L 0 -18 L 8 -11" fill="none" stroke="#B8860B" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Primary wordmark -->
  <text x="400" y="165" class="hero-text" font-size="48" text-anchor="middle">Điểm Tâm</text>
  <text x="404" y="205" class="sub-text"  font-size="14" text-anchor="middle">BẤT ĐỘNG SẢN</text>
  <text x="400" y="240" class="tagline-text" font-size="14" text-anchor="middle">Nơi mọi ngôi nhà tìm được chủ nhân</text>

  <!-- Dashed gold divider -->
  <line x1="200" y1="300" x2="600" y2="300" class="divider" opacity="0.4"/>

  <!-- Horizontal lockup (smaller variant) -->
  <g transform="translate(190, 410)">
    <path d="M 0 -22 L 16 0 L 0 22 L -16 0 Z" fill="none" stroke="#B8860B" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#B8860B"/>
    <path d="M -8 -11 L 0 -18 L 8 -11" fill="none" stroke="#B8860B" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <text x="235" y="390" class="hero-text" font-size="34" text-anchor="start">Điểm Tâm</text>
  <text x="237" y="420" class="sub-text"   font-size="13" text-anchor="start">BẤT ĐỘNG SẢN</text>
  <text x="235" y="445" class="tagline-text" font-size="13" text-anchor="start">Nơi mọi ngôi nhà tìm được chủ nhân</text>
</svg>
